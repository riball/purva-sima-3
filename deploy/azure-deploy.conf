# Azure deploy settings for Sima (committed; NOTHING SECRET goes in here).
#
# Read by deploy/azure.sh, deploy/github-setup.sh and the GitHub workflow
# .github/workflows/azure.yml. The scripts fill in the "written by" lines and
# then print the git command that publishes this file. The workflow skips
# quietly until the values it needs are filled in.
#
# None of these values are secrets: the IDs grant nothing on their own (only
# GitHub runs on main of this repository can sign in with them).
# API keys and passwords live only in .env.azure (never committed) and in the
# container app's secrets.
#
# Format: KEY=value, one per line, no quotes, no spaces around "=".

# --- Project (everything in Azure is named after APP_NAME) ---
# Container app, resource group, deploy identity (<app>-github) and image name.
# Lower-case letters, digits and dashes; starts with a letter; max 32 chars;
# must differ from every other project's app in the shared environment.
# Settings in .env.azure end in _sima; Azure secrets end in -sima.
APP_NAME=sima
# GitHub repository (owner/name) whose main branch may deploy.
GITHUB_REPO=riball/purva-sima-3
# Numeric owner and repository IDs (gh api repos/<owner>/<repo>), for the
# ID form of GitHub's OIDC subject. github-setup.sh re-checks them.
GITHUB_OWNER_ID=146092884
GITHUB_REPO_ID=1408534526

# --- Current host (left running; only read by deploy/render-env.sh) ---
# Render service whose settings are copied into .env.azure. If the name is
# wrong, render-env.sh lists the services the API key can see; then run
# bash deploy/render-env.sh <name>.
RENDER_SERVICE_NAME=purva-sima-3

# --- Azure subscription and region ---
AZURE_SUBSCRIPTION_ID=82aaf9d4-d161-4dab-8ecf-dff34de35353
AZURE_LOCATION=centralindia

# --- Shared Container Apps environment (read only: never created or changed) ---
ACA_ENV_NAME=purva-bot-env
ACA_ENV_RESOURCE_GROUP=purva-bot

# --- Container app sizing ---
# Path that answers 200 cheaply once the app is up (no database call).
HEALTH_PATH=/api/health
# vCPU and memory per replica (valid pairs: 0.25/0.5Gi, 0.5/1Gi, 0.75/1.5Gi, ...).
# 0.5/1Gi: a BOQ calculation is CPU-bound and peaks around 420 MiB. Measured
# locally on a real BOQ: 0.25/0.5Gi took ~10 min at 82% of its memory;
# 0.5/1Gi took ~4 min. Idle the server uses ~190 MiB.
CPU=0.5
MEMORY=1Gi
# 1 = always on: uploads are calculated in background jobs inside the server
# process, and a replica that scales to zero mid-job leaves it stuck.
MIN_REPLICAS=1
# Must stay 1: background jobs run in the process that accepted the upload,
# and the shared category list (canonical_material_categories.json) is a
# file on the container's disk.
MAX_REPLICAS=1

# --- Shared container registry (one for every project) ---
# All projects keep their images in this ONE registry, each in its own
# repository named after APP_NAME and allowed to reach only that one.
# Created once by deploy/shared-registry-setup.sh; this project moves to it
# with deploy/use-shared-registry.sh (see deploy/SHARED-REGISTRY.md).
SHARED_ACR_NAME=purvashared82aaf9d4
SHARED_ACR_RESOURCE_GROUP=purva-shared

# --- Written by deploy/azure.sh ---
# Registry the workflow pushes to and the app pulls from: this project's own
# (old) one, or the shared one above (written by deploy/use-shared-registry.sh).
ACR_NAME=purvashared82aaf9d4
# Public address of the container app (the web app and, under /api, the API).
BACKEND_URL=https://sima.lemonfield-c4c1d145.centralindia.azurecontainerapps.io

# --- Written by deploy/github-setup.sh ---
# Client ID of the deploy identity <app>-github, and the Azure tenant.
AZURE_CLIENT_ID=8a7d5b42-288b-4864-9129-3bd00448693d
AZURE_TENANT_ID=994a6b1b-9716-479f-8871-5cba672279aa

# --- Website ---
# None: the React web app is built into the same image and served by the
# backend from the same address (backend/app/server.py), so there is no
# Static Web App and no WEB_ENV_ settings for this project.
