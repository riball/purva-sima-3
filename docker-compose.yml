# Run the whole app (API + web app in ONE container):   docker compose up --build
#   -> http://localhost:8000        API docs -> http://localhost:8000/api/docs
#
# Configuration comes from backend/.env (copy backend/.env.example): GROQ_API_KEY, DATABASE_URL.
#
# Data lives in a database, not in the container. Two options:
#   A) Supabase: put its Session-pooler URI in DATABASE_URL (see README).
#   B) A local Postgres bundled here:
#        1. in backend/.env set  DATABASE_URL=postgresql://sima:sima@db:5432/sima
#        2. docker compose --profile localdb up --build
#      (the table is created automatically from backend/db/schema.sql on first start)

services:
  app:
    build: .
    env_file:
      - path: ./backend/.env
        required: false
    ports:
      - "8000:8000"
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    profiles: ["localdb"]
    environment:
      POSTGRES_USER: sima
      POSTGRES_PASSWORD: sima
      POSTGRES_DB: sima
    volumes:
      - sima_pgdata:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sima -d sima"]
      interval: 5s
      retries: 10
    restart: unless-stopped

volumes:
  sima_pgdata:
