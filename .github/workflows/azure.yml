# Builds this app's image and uploads it to its repository in the shared Azure
# registry (purvashared82aaf9d4.azurecr.io/sima). It does NOT deploy:
# RishabhWDB/purva-platform does, usually within 5-15 minutes, and holds the
# app's settings. This repo's Azure identity can only upload images.
#
# All values come from deploy/azure-deploy.conf (no GitHub variables or secrets).
name: Deploy to Azure

on:
  push:
    branches: [main]
    paths:
      - "backend/app/**"
      - "backend/db/**"
      - "backend/requirements.txt"
      - "frontend/**"
      - "deploy/Dockerfile"
      - "deploy/Dockerfile.dockerignore"
      - "deploy/azure-deploy.conf"
      - ".github/workflows/azure.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: azure-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Read deploy/azure-deploy.conf
        id: conf
        shell: bash
        run: |
          set -euo pipefail
          conf=deploy/azure-deploy.conf
          get() {
            awk -v k="$1" '{ sub(/\r$/, "") } /^[ \t]*#/ { next } index($0, "=") == 0 { next }
              { key = substr($0, 1, index($0, "=") - 1); gsub(/^[ \t]+|[ \t]+$/, "", key)
                if (key == k) { v = substr($0, index($0, "=") + 1); gsub(/^[ \t]+|[ \t]+$/, "", v); val = v } }
              END { print val }' "$conf"
          }
          app="$(get APP_NAME)"; sub="$(get AZURE_SUBSCRIPTION_ID)"; tenant="$(get AZURE_TENANT_ID)"
          client="$(get AZURE_CLIENT_ID)"; acr="$(get ACR_NAME)"; health="$(get HEALTH_PATH)"

          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::notice::Deploys run only from main (this is ${GITHUB_REF}); skipping."
            echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          missing=""
          for k in app sub tenant client acr; do [ -n "${!k}" ] || missing="$missing $k"; done
          if [ -n "$missing" ]; then
            echo "::notice::Azure isn't set up yet (empty in $conf:$missing). Ask the Azure platform owner (see deploy/AZURE.md). Skipping."
            echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          guid='^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
          echo "$app" | grep -Eq '^[a-z][a-z0-9-]{0,31}$' || { echo "::error::bad APP_NAME"; exit 1; }
          echo "$acr" | grep -Eq '^[a-z0-9]{5,50}$' || { echo "::error::bad ACR_NAME"; exit 1; }
          for v in "$sub" "$tenant" "$client"; do echo "$v" | grep -Eq "$guid" || { echo "::error::bad ID in $conf"; exit 1; }; done
          case "$health" in /*) ;; *) health=/ ;; esac

          {
            echo "ready=true"
            echo "app=$app"
            echo "sub=$sub"
            echo "tenant=$tenant"
            echo "client=$client"
            echo "acr=$acr"
            echo "health=$health"
            echo "image=$acr.azurecr.io/$app:$(git rev-parse --short=12 HEAD)-${GITHUB_RUN_ATTEMPT}"
          } >> "$GITHUB_OUTPUT"

      - name: Sign in to Azure (OIDC, no stored secret)
        if: steps.conf.outputs.ready == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ steps.conf.outputs.client }}
          tenant-id: ${{ steps.conf.outputs.tenant }}
          subscription-id: ${{ steps.conf.outputs.sub }}

      - name: Build image
        if: steps.conf.outputs.ready == 'true'
        env:
          IMAGE: ${{ steps.conf.outputs.image }}
        run: docker build --platform linux/amd64 -f deploy/Dockerfile -t "$IMAGE" .

      - name: Push image
        if: steps.conf.outputs.ready == 'true'
        env:
          ACR: ${{ steps.conf.outputs.acr }}
          IMAGE: ${{ steps.conf.outputs.image }}
        run: |
          az extension add --name containerapp --upgrade --yes --only-show-errors
          az acr login --name "$ACR"
          docker push "$IMAGE"

      - name: Hand over to purva-platform (it deploys the image)
        if: steps.conf.outputs.ready == 'true'
        env:
          UPLOADED: ${{ steps.conf.outputs.image }}
        run: |
          echo "::notice::Uploaded $UPLOADED. RishabhWDB/purva-platform deploys it, usually within 5-15 minutes."
          {
            echo "### Uploaded \`$UPLOADED\`"
            echo "Goes live within about 5-15 minutes: https://github.com/RishabhWDB/purva-platform/actions"
          } >> "$GITHUB_STEP_SUMMARY"
